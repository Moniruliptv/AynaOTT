name: Fetch M3U Daily

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"   # প্রতিদিন 12:00 AM UTC (বাংলাদেশ সময় সকাল 6টা)

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install requests
        run: pip install requests

      - name: Run script
        run: python fetch_m3u.py

      - name: Commit playlist
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add playlist.m3u
          git commit -m "Auto update M3U" || echo "No changes"
          git push
